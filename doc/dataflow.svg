<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-label="2D FFT dataflow across PS, PL, AIE, and DDR">
  <defs>
    <marker id="ah-green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#4dc25a"/>
    </marker>
    <marker id="ah-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <polygon points="0 0, 5 2.5, 0 5" fill="#79c0ff"/>
    </marker>
    <style>
      text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; dominant-baseline: middle; }
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; }
      .frame { stroke-width: 1.6; }
      .ddr { stroke: #79c0ff; }
      .pl  { stroke: #4dc25a; }
      .aie { stroke: #d2a8ff; }
      .ps  { stroke: #d29922; }
      .name { fill: #c9d1d9; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .sub  { fill: #6e7681; font-size: 10px; text-anchor: middle; }
      .arrow { stroke: #4dc25a; stroke-width: 1.6; fill: none; marker-end: url(#ah-green); }
      .control { stroke: #79c0ff; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; marker-end: url(#ah-blue); }
      .lbl { fill: #6e7681; font-size: 10px; text-anchor: middle; font-weight: 700; }
      .lg-label { fill: #c9d1d9; font-size: 11px; dominant-baseline: middle; }
      .lg-title { fill: #6e7681; font-size: 10px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="460"/>

  <!-- PS controller -->
  <g>
    <rect class="panel frame ps" x="40" y="20" width="190" height="46" rx="3"/>
    <text class="name" x="135" y="38" fill="#e3b341">PS</text>
    <text class="sub" x="135" y="55">ARM Cortex-A72 CPU core · XRT</text>
  </g>
  <path class="control" d="M 135 68 L 135 100"/>
  <text class="lbl" x="220" y="84" fill="#79c0ff">XRT control</text>

  <!-- Legend (top right) -->
  <g transform="translate(820, 24)">
    <text class="lg-title" x="0" y="2">LEGEND</text>
    <g transform="translate(0, 22)">
      <rect class="frame ddr" x="0" y="-7" width="14" height="14" rx="2" fill="none"/>
      <text class="lg-label" x="22" y="0">DDR</text>

      <rect class="frame pl" x="70" y="-7" width="14" height="14" rx="2" fill="none"/>
      <text class="lg-label" x="92" y="0">PL</text>

      <rect class="frame aie" x="130" y="-7" width="14" height="14" rx="2" fill="none"/>
      <text class="lg-label" x="152" y="0">AIE</text>

      <rect class="frame ps" x="190" y="-7" width="14" height="14" rx="2" fill="none"/>
      <text class="lg-label" x="212" y="0">PS</text>
    </g>
  </g>

  <!-- Chip frame -->
  <rect x="30" y="100" width="1050" height="280" rx="4" fill="none" stroke="#21262d"/>
  <text x="44" y="118" fill="#6e7681" font-size="11">Versal Chip</text>

  <!-- ============ Row 1 (y=200): DDR_in → mm2s → AIE Col → s2mm → DDR_int ============ -->
  <g>
    <rect class="panel frame ddr" x="85" y="175" width="90" height="50" rx="3"/>
    <text class="name" x="130" y="195" fill="#79c0ff">DDR</text>
    <text class="sub" x="130" y="212">8 MB matrix</text>
  </g>
  <g>
    <rect class="panel frame pl" x="280" y="175" width="100" height="50" rx="3"/>
    <text class="name" x="330" y="195">mm2s</text>
    <text class="sub" x="330" y="212">PL datamover</text>
  </g>
  <g>
    <rect class="panel frame aie" x="465" y="170" width="190" height="60" rx="3"/>
    <text class="name" x="560" y="192" fill="#d2a8ff">AIE · Col FFT + Twd</text>
    <text class="sub" x="560" y="212">1024-pt × twiddle mul</text>
  </g>
  <g>
    <rect class="panel frame pl" x="745" y="175" width="100" height="50" rx="3"/>
    <text class="name" x="795" y="195">s2mm</text>
    <text class="sub" x="795" y="212">PL datamover</text>
  </g>
  <g>
    <rect class="panel frame ddr" x="935" y="175" width="120" height="50" rx="3"/>
    <text class="name" x="995" y="195" fill="#79c0ff">DDR</text>
    <text class="sub" x="995" y="212">intermediate</text>
  </g>

  <!-- Row 1 arrows (horizontal) -->
  <path class="arrow" d="M 178 200 L 273 200"/>
  <path class="arrow" d="M 383 200 L 458 200"/>
  <path class="arrow" d="M 658 200 L 738 200"/>
  <path class="arrow" d="M 848 200 L 928 200"/>
  <text class="lbl" x="225" y="187">② AXI-MM</text>
  <text class="lbl" x="420" y="187">③ PLIO</text>
  <text class="lbl" x="698" y="187">④ PLIO</text>
  <text class="lbl" x="888" y="187">⑤ AXI-MM</text>

  <!-- Step ⑥ connector: DDR_int (Row 1, bottom) → strided (Row 2, top), orthogonal -->
  <path class="arrow" d="M 995 225 L 995 280 L 285 280 L 285 333"/>
  <text class="lbl" x="640" y="270">⑥ AXI-MM (轉置式讀)</text>

  <!-- ============ Row 2 (y=365, LTR): strided → AIE Row → DDR_final ============ -->
  <g>
    <rect class="panel frame pl" x="200" y="335" width="170" height="60" rx="3"/>
    <text class="name" x="285" y="358">strided_mm2s</text>
    <text class="sub" x="285" y="378">stride=1024 · 邊讀邊轉置</text>
  </g>
  <g>
    <rect class="panel frame aie" x="465" y="335" width="190" height="60" rx="3"/>
    <text class="name" x="560" y="358" fill="#d2a8ff">AIE · Row FFT</text>
    <text class="sub" x="560" y="378">1024-pt</text>
  </g>
  <g>
    <rect class="panel frame ddr" x="745" y="335" width="200" height="60" rx="3"/>
    <text class="name" x="845" y="358" fill="#79c0ff">DDR (final)</text>
    <text class="sub" x="845" y="378">2D FFT result</text>
  </g>

  <!-- Row 2 arrows (horizontal, LTR) -->
  <path class="arrow" d="M 373 365 L 458 365"/>
  <path class="arrow" d="M 658 365 L 738 365"/>
  <text class="lbl" x="416" y="352">⑦ PLIO</text>
  <text class="lbl" x="698" y="352">⑧ GMIO (AIE 直寫 DDR)</text>

  <text x="550" y="430" fill="#6e7681" font-size="10" text-anchor="middle">
    三個 DDR 區塊代表同一塊物理記憶體在不同階段的狀態
  </text>
</svg>
