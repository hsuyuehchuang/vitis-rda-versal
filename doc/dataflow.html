<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>vitis-rda-versal :: 2D FFT dataflow (interactive)</title>
<style>
  :root {
    --bg: #0d1117;
    --frame: #30363d;
    --frame-dim: #21262d;
    --green: #4dc25a;
    --green-bright: #7ee787;
    --blue: #79c0ff;
    --orange: #d29922;
    --yellow: #ffd60a;
    --pink: #ff7b72;
    --dim: #6e7681;
    --panel: #161b22;
    --text: #c9d1d9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    min-height: 100vh;
  }
  body { padding: 18px; }

  header.bar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 14px; border: 1px solid var(--frame);
    border-radius: 6px; background: var(--panel);
  }
  header .title { color: var(--green-bright); font-weight: bold; font-size: 14px; }
  header .spacer { flex: 1; }
  header .hint { color: var(--dim); font-size: 12px; }
  header button {
    background: var(--panel); color: var(--green-bright);
    border: 1px solid var(--green); border-radius: 4px;
    padding: 6px 14px; font-family: inherit; font-size: 13px;
    cursor: pointer; transition: all .15s;
  }
  header button:hover { background: var(--green); color: #0d1117; }
  header button.playing { background: var(--yellow); color: #0d1117; border-color: var(--yellow); }
  header .counter { color: var(--yellow); font-size: 13px; min-width: 60px; text-align: right; }

  main {
    margin-top: 14px;
    display: grid;
    grid-template-rows: auto auto;
    gap: 14px;
  }

  .diagram-wrap {
    border: 1px solid var(--frame);
    border-radius: 6px;
    background: var(--panel);
    padding: 14px;
    overflow-x: auto;
  }
  .diagram-wrap svg { display: block; width: 100%; height: auto; }

  /* SVG styles */
  svg text {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    dominant-baseline: middle;
  }
  svg .block-bg   { fill: #161b22; }
  svg .block-name { fill: var(--text); font-size: 13px; font-weight: bold; text-anchor: middle; pointer-events: none; }
  svg .block-sub  { fill: var(--dim);  font-size: 10px; text-anchor: middle; pointer-events: none; }

  svg .block-frame { stroke: var(--green); stroke-width: 1.6; transition: all .2s; }
  svg .block-ddr   { stroke: var(--blue); }
  svg .block-ps    { stroke: var(--orange); }

  svg .clickable { cursor: pointer; }
  svg .clickable .block-bg { transition: fill .2s; }
  svg .clickable:hover .block-bg { fill: #1c2330; }
  svg .clickable:hover .block-frame { stroke-width: 2.2; }

  svg .arrow {
    stroke: var(--green); stroke-width: 1.6; fill: none;
    marker-end: url(#ah-green);
    transition: stroke .2s, stroke-width .2s;
  }
  svg .lbl-step { fill: var(--dim); font-size: 10px; text-anchor: middle; font-weight: bold; }
  svg .lbl      { fill: var(--dim); font-size: 10px; text-anchor: middle; }
  svg .control-arrow {
    stroke: var(--blue); stroke-width: 1.2;
    stroke-dasharray: 4,3; fill: none;
    marker-end: url(#ah-blue);
  }

  /* ACTIVE state */
  svg .clickable.active .block-frame {
    stroke: var(--yellow) !important; stroke-width: 2.4;
    filter: drop-shadow(0 0 6px var(--yellow)) drop-shadow(0 0 2px var(--yellow));
  }
  svg .arrow.active {
    stroke: var(--yellow); stroke-width: 2.2;
    filter: drop-shadow(0 0 4px var(--yellow));
    marker-end: url(#ah-yellow);
  }

  /* terminal panel */
  .terminal {
    border: 1px solid var(--frame);
    border-radius: 6px;
    background: var(--panel);
    padding: 14px 18px;
    min-height: 130px;
    font-size: 13px;
    line-height: 1.7;
  }
  .terminal .prompt { color: var(--dim); }
  .terminal .step-tag { color: var(--yellow); font-weight: bold; }
  .terminal .step-title { color: var(--green-bright); font-weight: bold; }
  .terminal .step-desc { color: var(--text); margin-top: 4px; }
  .terminal .step-desc code {
    background: #0d1117; color: var(--blue); padding: 1px 5px;
    border-radius: 3px; font-size: 12px;
  }
  .terminal .cursor { color: var(--green-bright); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    margin-top: 14px; color: var(--dim); font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>

<header class="bar">
  <span class="title">▸ vitis-rda-versal :: 1024 × 1024 2D FFT dataflow (interactive)</span>
  <span class="spacer"></span>
  <span class="hint">點任一區塊查看說明 · 鍵盤 ← → 切換</span>
  <span class="counter" id="counter">– / 8</span>
  <button id="btn-play">▶ Play All</button>
  <button id="btn-reset">⟲ Reset</button>
</header>

<main>
  <div class="diagram-wrap">
    <svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ah-green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
          <polygon points="0 0, 6 3, 0 6" fill="#4dc25a"/>
        </marker>
        <marker id="ah-yellow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
          <polygon points="0 0, 6 3, 0 6" fill="#ffd60a"/>
        </marker>
        <marker id="ah-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
          <polygon points="0 0, 5 2.5, 0 5" fill="#79c0ff"/>
        </marker>
      </defs>

      <!-- ============ PS controller (clickable, role=control) ============ -->
      <g class="clickable" data-block="ps">
        <rect class="block-bg block-frame block-ps" x="40" y="20" width="160" height="46" rx="3"/>
        <text class="block-name" x="120" y="38" fill="#e3b341">PS (ARM Cortex-A72 CPU core)</text>
        <text class="block-sub"  x="120" y="55">host.cpp · XRT</text>
      </g>
      <path class="control-arrow" id="arr-ctl" d="M 120 68 L 120 100"/>
      <text class="lbl" x="195" y="84" fill="#79c0ff">XRT control (虛線)</text>

      <!-- ============ Versal Chip frame ============ -->
      <rect x="30" y="100" width="1050" height="280" rx="4" fill="none" stroke="#21262d"/>
      <text x="44" y="118" fill="#6e7681" font-size="11">┌ Versal Chip ──────────────────────────────────────────────────────────────────────────</text>

      <!-- =========================================================
           TOP ROW (y = 200): DDR → mm2s → Col_FFT → s2mm → DDR_int
           ========================================================= -->

      <!-- Step 1: DDR_in -->
      <g class="clickable" data-block="ddr-in">
        <rect class="block-bg block-frame block-ddr" x="85" y="175" width="90" height="50" rx="3"/>
        <text class="block-name" x="130" y="195" fill="#79c0ff">DDR</text>
        <text class="block-sub"  x="130" y="212">8 MB matrix</text>
      </g>

      <!-- Step 2: mm2s -->
      <g class="clickable" data-block="mm2s">
        <rect class="block-bg block-frame" x="280" y="175" width="100" height="50" rx="3"/>
        <text class="block-name" x="330" y="195">mm2s</text>
        <text class="block-sub"  x="330" y="212">PL datamover</text>
      </g>

      <!-- Step 3: Col FFT -->
      <g class="clickable" data-block="col">
        <rect class="block-bg block-frame" x="465" y="170" width="190" height="60" rx="3"/>
        <text class="block-name" x="560" y="192">AIE · Col FFT + Twd</text>
        <text class="block-sub"  x="560" y="212">1024-pt × twiddle mul</text>
      </g>

      <!-- Step 4: s2mm -->
      <g class="clickable" data-block="s2mm">
        <rect class="block-bg block-frame" x="745" y="175" width="100" height="50" rx="3"/>
        <text class="block-name" x="795" y="195">s2mm</text>
        <text class="block-sub"  x="795" y="212">PL datamover</text>
      </g>

      <!-- Step 5: DDR_int -->
      <g class="clickable" data-block="ddr-int">
        <rect class="block-bg block-frame block-ddr" x="935" y="175" width="120" height="50" rx="3"/>
        <text class="block-name" x="995" y="195" fill="#79c0ff">DDR</text>
        <text class="block-sub"  x="995" y="212">intermediate</text>
      </g>

      <!-- Top arrows -->
      <path class="arrow" id="arr-1-2" d="M 178 200 L 273 200"/>
      <path class="arrow" id="arr-2-3" d="M 383 200 L 458 200"/>
      <path class="arrow" id="arr-3-4" d="M 658 200 L 738 200"/>
      <path class="arrow" id="arr-4-5" d="M 848 200 L 928 200"/>

      <text class="lbl-step" x="225" y="187">AXI-MM</text>
      <text class="lbl-step" x="420" y="187">PLIO</text>
      <text class="lbl-step" x="698" y="187">PLIO</text>
      <text class="lbl-step" x="888" y="187">AXI-MM</text>

      <!-- U-turn arrow: DDR_int (right side) curves down to strided -->
      <path class="arrow" id="arr-5-6" d="M 995 228 C 1075 240, 1075 350, 920 360"/>
      <text class="lbl-step" x="1058" y="295">AXI-MM</text>
      <text class="lbl" x="1058" y="310">(轉置式讀)</text>

      <!-- =========================================================
           BOTTOM ROW (y = 365): strided → Row_FFT → DDR_final
           ========================================================= -->

      <!-- Step 6: strided_mm2s -->
      <g class="clickable" data-block="strided">
        <rect class="block-bg block-frame" x="745" y="335" width="170" height="60" rx="3"/>
        <text class="block-name" x="830" y="358">strided_mm2s</text>
        <text class="block-sub"  x="830" y="378">stride=1024 · 邊讀邊轉置</text>
      </g>

      <!-- Step 7: Row FFT -->
      <g class="clickable" data-block="row">
        <rect class="block-bg block-frame" x="465" y="335" width="190" height="60" rx="3"/>
        <text class="block-name" x="560" y="358">AIE · Row FFT</text>
        <text class="block-sub"  x="560" y="378">1024-pt</text>
      </g>

      <!-- Step 8: DDR_final -->
      <g class="clickable" data-block="ddr-fin">
        <rect class="block-bg block-frame block-ddr" x="85" y="335" width="190" height="60" rx="3"/>
        <text class="block-name" x="180" y="358" fill="#79c0ff">DDR (final)</text>
        <text class="block-sub"  x="180" y="378">2D FFT result</text>
      </g>

      <!-- Bottom arrows -->
      <path class="arrow" id="arr-6-7" d="M 740 365 L 663 365"/>
      <path class="arrow" id="arr-7-8" d="M 458 365 L 283 365"/>
      <text class="lbl-step" x="700" y="350">PLIO</text>
      <text class="lbl-step" x="370" y="350">GMIO (AIE 直寫 DDR)</text>

      <!-- DDR note -->
      <text x="550" y="430" fill="#6e7681" font-size="10" text-anchor="middle">
        ※ 三個 DDR 區塊代表同一塊物理記憶體在不同階段的狀態
      </text>
    </svg>
  </div>

  <div class="terminal" id="terminal">
    <span class="prompt">$ aie_dataflow --explain</span><br>
    <span class="step-desc">點上方任一區塊查看該步驟的詳細說明<span class="cursor"> ▌</span></span>
  </div>
</main>

<footer>
  鍵盤快捷鍵：<b>← →</b> 上下一步 · <b>空白鍵</b> Play/Stop · <b>Esc</b> Reset
</footer>

<script>
  // ============ Step data ============
  const STEPS = [
    {
      key: 'ps',
      tag: '[1/8]',
      title: '① PS (ARM Cortex-A72 CPU core) · 控制 / 觸發',
      desc: 'Linux 跑在 PS 上的 <code>host.exe</code> 透過 XRT API 載入 <code>.xclbin</code>、配置 DDR buffer、啟動 AIE graph，並觸發 PL data mover。<b>PS 不在資料路徑上，只負責下命令。</b>',
      arrows: ['arr-ctl'],
    },
    {
      key: 'ddr-in',
      tag: '[2/8]',
      title: '② DDR → mm2s · AXI-MM 讀 column',
      desc: '輸入是 1024 × 1024 個 <code>cfloat</code>（約 8 MB）的矩陣，先放在 DDR。PL 的 <code>mm2s</code> 透過 <code>AXI-MM</code> 從 DDR 讀取 column 資料，準備轉成 stream 餵給 AIE。',
      arrows: ['arr-1-2'],
    },
    {
      key: 'mm2s',
      tag: '[3/8]',
      title: '③ mm2s → Col FFT · PLIO 串流',
      desc: '<code>mm2s</code> 是 HLS 寫的 PL 模組，職責是把 memory-mapped 的 DDR 資料轉成 <code>AXI-Stream</code>，再經由 <code>PLIO</code> 串流送進 AIE 的 Column FFT graph。',
      arrows: ['arr-2-3'],
    },
    {
      key: 'col',
      tag: '[4/8]',
      title: '④ Col FFT + Twd Mul → s2mm · PLIO 串流',
      desc: 'AIE 上的 <code>ColFftTwdMulGraph</code> 收 1024 個 <code>cfloat</code>，執行 1024-pt FFT 後乘上 twiddle factor。這是 Cooley-Tukey 2D FFT 的 Column 階段，結果再透過 <code>PLIO</code> 丟回 PL。',
      arrows: ['arr-3-4'],
    },
    {
      key: 's2mm',
      tag: '[5/8]',
      title: '⑤ s2mm → DDR · AXI-MM 寫中間結果',
      desc: '<code>s2mm</code> 接住 AIE 算完的 Column 結果，將 stream 轉回 memory-mapped transaction，透過 <code>AXI-MM</code> 寫回 DDR。此時 DDR 裡放的是 Column FFT + twiddle 後的中間矩陣。',
      arrows: ['arr-4-5'],
    },
    {
      key: 'ddr-int',
      tag: '[6/8]',
      title: '⑥ DDR → strided_mm2s · AXI-MM 轉置式讀 row',
      desc: 'Column 階段的中間結果仍在同一塊 DDR。Row 階段由 <code>fft_strided_mm2s</code> 用 stride = 1024 的位址模式讀取，等於在搬資料時同步完成轉置。',
      arrows: ['arr-5-6'],
    },
    {
      key: 'strided',
      tag: '[7/8]',
      title: '⑦ strided_mm2s → Row FFT · PLIO 串流',
      desc: '<code>fft_strided_mm2s</code> 把轉置式讀出的 row 資料轉成 <code>PLIO</code> 串流，送進 AIE 的 <code>RowFftGraph</code>。PL 在這裡仍然是搬運專員，不負責 FFT 計算。',
      arrows: ['arr-6-7'],
    },
    {
      key: 'row',
      tag: '[8/8]',
      title: '⑧ Row FFT → DDR · GMIO 寫最終結果',
      desc: 'AIE 上的 <code>RowFftGraph</code> 再執行一次 1024-pt FFT，完成 Row 階段。結果透過 <code>GMIO</code> 直接寫回 DDR，跳過 PL。PS 最後再把 DDR 內的結果存回 SD card 給驗證腳本檢查。',
      arrows: ['arr-7-8'],
    },
    {
      key: 'ddr-fin',
      tag: '[done]',
      title: 'DDR · 最終 2D FFT 結果',
      desc: '最終結果仍在 DDR，只是內容已經從輸入矩陣變成完整的 2D FFT output。圖中的三個 DDR 區塊代表同一塊物理記憶體在不同階段的資料狀態。',
      arrows: ['arr-7-8'],
    },
  ];

  // ============ State ============
  const elBlocks = document.querySelectorAll('[data-block]');
  const elTerm = document.getElementById('terminal');
  const elCounter = document.getElementById('counter');
  const btnPlay = document.getElementById('btn-play');
  const btnReset = document.getElementById('btn-reset');

  let currentIdx = -1;     // index into STEPS; -1 = nothing selected
  let playTimer = null;

  function indexOfKey(k) { return STEPS.findIndex(s => s.key === k); }

  function clearAllHighlights() {
    elBlocks.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.arrow, .control-arrow').forEach(a => a.classList.remove('active'));
  }

  function highlight(stepIdx) {
    clearAllHighlights();
    if (stepIdx < 0 || stepIdx >= STEPS.length) return;
    const step = STEPS[stepIdx];
    const blk = document.querySelector(`[data-block="${step.key}"]`);
    blk?.classList.add('active');
    step.arrows.forEach(id => document.getElementById(id)?.classList.add('active'));
  }

  function updateTerminal(stepIdx) {
    if (stepIdx < 0) {
      elTerm.innerHTML = `<span class="prompt">$ aie_dataflow --explain</span><br>
        <span class="step-desc">點上方任一區塊查看該步驟的詳細說明<span class="cursor"> ▌</span></span>`;
      elCounter.textContent = '– / 8';
      return;
    }
    const s = STEPS[stepIdx];
    elCounter.textContent = s.tag === '[done]' ? 'done' : `${stepIdx + 1} / 8`;
    elTerm.innerHTML = `
      <span class="prompt">$ aie_dataflow --step ${s.key}</span><br>
      <span class="step-tag">${s.tag}</span> <span class="step-title">${s.title}</span><br>
      <span class="step-desc">${s.desc}<span class="cursor"> ▌</span></span>`;
  }

  function selectStep(idx) {
    currentIdx = idx;
    highlight(idx);
    updateTerminal(idx);
  }

  // ============ Click handlers ============
  elBlocks.forEach(b => {
    b.addEventListener('click', () => {
      stopPlay();
      const idx = indexOfKey(b.dataset.block);
      selectStep(idx);
    });
  });

  // ============ Play All ============
  function startPlay() {
    btnPlay.textContent = '■ Stop';
    btnPlay.classList.add('playing');
    let i = (currentIdx >= 0 && currentIdx < 8) ? currentIdx : 0;
    selectStep(i);
    playTimer = setInterval(() => {
      i++;
      if (i > 7) { stopPlay(); return; }
      selectStep(i);
    }, 1200);
  }
  function stopPlay() {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
    btnPlay.textContent = '▶ Play All';
    btnPlay.classList.remove('playing');
  }
  btnPlay.addEventListener('click', () => playTimer ? stopPlay() : startPlay());

  // ============ Reset ============
  btnReset.addEventListener('click', () => {
    stopPlay();
    selectStep(-1);
  });

  // ============ Keyboard shortcuts ============
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      stopPlay();
      const next = currentIdx < 0 ? 0 : Math.min(currentIdx + 1, 8);
      selectStep(next);
    } else if (e.key === 'ArrowLeft') {
      stopPlay();
      const prev = currentIdx <= 0 ? 0 : currentIdx - 1;
      selectStep(prev);
    } else if (e.key === ' ') {
      e.preventDefault();
      playTimer ? stopPlay() : startPlay();
    } else if (e.key === 'Escape') {
      stopPlay();
      selectStep(-1);
    }
  });

  // Initial state
  selectStep(-1);
</script>
</body>
</html>
