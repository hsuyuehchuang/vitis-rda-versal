<!doctype html>
<html lang="$if(lang)$$lang$$else$zh-TW$endif$">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="generator" content="pandoc" />
$for(author-meta)$
<meta name="author" content="$author-meta$" />
$endfor$
$if(date-meta)$
<meta name="dcterms.date" content="$date-meta$" />
$endif$
<title>$if(title-prefix)$$title-prefix$ – $endif$$pagetitle$</title>

<!-- highlight.js for code block syntax highlighting (theme swapped by dark mode JS) -->
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-light.min.css" />
<link id="hljs-dark"  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css" disabled />
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>

<!-- Mermaid (no-op if no .mermaid blocks) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<!-- Glossary (optional; if missing or wrong path, tooltips are silently skipped).
     Default looks for "./glossary.js" next to the generated HTML.
     Override with:  pandoc ... --metadata glossary=./your-path/glossary.js -->
<script src="$if(glossary)$$glossary$$else$./glossary.js$endif$" onerror="window.GLOSSARY={};"></script>

<style>
  :root {
    --bg:        #fafafa;
    --fg:        #1d1d1f;
    --muted:    #6b7280;
    --accent:   #0a84ff;
    --card:     #ffffff;
    --border:   #e5e7eb;
    --code-bg:  #f3f4f6;
    --code-fg:  #d97706;   /* inline code 亮橘色（light） */
    --quote-bg: #f1f5f9;
    --term-bg:  #fff7ed;
    --term-bd:  #fdba74;
    --shadow:   0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  html.dark {
    --bg:        #0f1115;
    --fg:        #e5e7eb;
    --muted:    #9ca3af;
    --accent:   #4dabff;
    --card:     #161a22;
    --border:   #2a2f3a;
    --code-bg:  #1d222b;
    --code-fg:  #ffa657;   /* inline code 亮橘色（dark，類似 GitHub Dark） */
    --quote-bg: #1a1f2a;
    --term-bg:  #2a1f10;
    --term-bd:  #b45309;
    --shadow:   0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* === A2 閱讀進度條 === */
  #read-progress {
    position: fixed; top: 0; left: 0; height: 3px;
    width: 0; background: var(--accent);
    z-index: 100; transition: width .08s linear;
  }

  header.topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    padding: 10px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  header button:hover { background: var(--code-bg); }

  .layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    gap: 32px;
  }
  nav.toc {
    position: sticky; top: 72px; align-self: start;
    max-height: calc(100vh - 96px); overflow-y: auto;
    font-size: 14px;
  }
  nav.toc h3 {
    font-size: 12px; text-transform: uppercase; color: var(--muted);
    letter-spacing: .08em; margin: 0 0 8px;
  }
  /* Pandoc 產生的 toc 是巢狀 <ul><li><a>，這裡讓 H2 看起來是頂層 */
  nav.toc ul { list-style: none; padding: 0; margin: 0; }
  nav.toc li { margin: 0; }
  nav.toc a {
    display: block; padding: 4px 8px; border-radius: 6px;
    color: var(--fg); border-left: 2px solid transparent;
  }
  nav.toc a:hover { background: var(--code-bg); text-decoration: none; }
  nav.toc a.active {
    background: var(--code-bg); border-left-color: var(--accent);
    color: var(--accent); font-weight: 500;
  }
  /* H1（最外層）粗體 */
  nav.toc > ul > li > a { font-weight: 600; }
  /* H3 (nested 2 層以上) 縮排 + 淡色 */
  nav.toc ul ul ul a { padding-left: 24px; color: var(--muted); font-size: 13px; }
  nav.toc ul ul ul ul a { padding-left: 36px; }

  main { min-width: 0; }
  main h1 { font-size: 28px; margin: 0 0 12px; }
  main h2 {
    font-size: 22px; margin: 40px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 70px;
  }
  main h3 { font-size: 18px; margin: 28px 0 8px; scroll-margin-top: 70px; }
  main h4 { font-size: 16px; margin: 20px 0 6px; scroll-margin-top: 70px; }
  main p, main li { color: var(--fg); }
  main ul, main ol { padding-left: 22px; }
  blockquote {
    margin: 14px 0;
    padding: 12px 16px;
    background: var(--quote-bg);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    color: var(--fg);
  }
  blockquote p { margin: 4px 0; }

  /* === A4 程式碼樣式 === */
  code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.92em;
    color: var(--code-fg);  /* 亮橘色 */
  }
  pre {
    background: var(--code-bg);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid var(--border);
    position: relative;
  }
  pre code {
    background: transparent; padding: 0; font-size: 13px; line-height: 1.5;
    color: inherit;  /* 在 pre 內由 highlight.js 控色 */
  }
  pre .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
    opacity: 0; transition: opacity .15s;
  }
  pre:hover .copy-btn { opacity: 1; }
  pre .copy-btn:hover { color: var(--accent); }

  table {
    width: 100%; border-collapse: collapse; margin: 14px 0;
    background: var(--card); border-radius: 8px; overflow: hidden;
    box-shadow: var(--shadow); font-size: 14px;
  }
  th, td {
    text-align: left; padding: 10px 14px;
    border-bottom: 1px solid var(--border); vertical-align: top;
  }
  th { background: var(--code-bg); font-weight: 600; color: var(--fg); }
  tr:last-child td { border-bottom: none; }

  img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: var(--shadow); display: block; margin: 12px 0; }

  /* === A3 details / summary === */
  details {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 14px 0;
    background: var(--card);
  }
  details > summary {
    cursor: pointer;
    font-weight: 600;
    padding: 4px 0;
    list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: "▸"; color: var(--muted); transition: transform .15s;
    display: inline-block;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  details[open] { padding-bottom: 14px; }

  /* === A1 詞彙懸停提示 === */
  .term {
    background: var(--term-bg);
    border-bottom: 1px dashed var(--term-bd);
    padding: 0 2px;
    border-radius: 2px;
    cursor: help;
    position: relative;
  }
  .term-tooltip {
    position: fixed;
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.55;
    max-width: 360px;
    box-shadow: var(--shadow);
    pointer-events: none;
    z-index: 200;
    opacity: 0;
    transition: opacity .12s;
  }
  .term-tooltip.visible { opacity: 1; }
  .term-tooltip strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 14px; }

  .mermaid {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin: 14px 0;
    text-align: center;
    overflow-x: auto;
  }
  .mermaid svg { max-width: 100%; height: auto !important; }

  hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav.toc { position: static; max-height: none; }
  }
  @media print {
    header.topbar, nav.toc, #read-progress, .copy-btn { display: none !important; }
    .layout { grid-template-columns: 1fr; padding: 0; }
    body { font-size: 12px; line-height: 1.5; }
    pre, table, details { page-break-inside: avoid; }
    details { border: none; padding: 0; }
    details[open] > summary { display: none; }
    /* 確保印出時 details 內容都展開 */
    details:not([open]) > *:not(summary) { display: block !important; }
    .term { background: transparent; border-bottom: none; }
  }

$for(header-includes)$
  $header-includes$
$endfor$
</style>
</head>
<body>

<!-- A2 進度條 -->
<div id="read-progress"></div>

<header class="topbar">
  <span class="title">$if(title)$$title$$else$$pagetitle$$endif$</span>
  <span class="spacer"></span>
  <button id="toggle-dark" title="切換深淺模式">Dark</button>
  <button onclick="window.print()" title="列印 / 存 PDF">Print</button>
</header>

<div class="layout">
$if(toc)$
  <nav class="toc" id="toc">
    <h3>$if(toc-title)$$toc-title$$else$章節導覽$endif$</h3>
    $table-of-contents$
  </nav>
$endif$

  <main>
$body$
  </main>
</div>

$for(include-after)$
$include-after$
$endfor$

<!-- Tooltip element shared by A1 glossary -->
<div class="term-tooltip" id="term-tooltip" role="tooltip"></div>

<script>
  const root = document.documentElement;
  const darkBtn = document.getElementById('toggle-dark');
  const hljsLight = document.getElementById('hljs-light');
  const hljsDark  = document.getElementById('hljs-dark');

  // === Dark mode ===
  function applyTheme(isDark) {
    root.classList.toggle('dark', isDark);
    if (hljsLight) hljsLight.disabled = isDark;
    if (hljsDark)  hljsDark.disabled  = !isDark;
    darkBtn.textContent = isDark ? 'Light' : 'Dark';
  }
  const savedTheme = localStorage.getItem('notes-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));

  darkBtn.addEventListener('click', () => {
    const next = !root.classList.contains('dark');
    applyTheme(next);
    localStorage.setItem('notes-theme', next ? 'dark' : 'light');
    initMermaid();
  });

  // === Mermaid (no-op when no .mermaid blocks) ===
  function initMermaid() {
    if (!window.mermaid) return;
    const blocks = document.querySelectorAll('.mermaid');
    if (!blocks.length) return;
    const isDark = root.classList.contains('dark');
    blocks.forEach(el => {
      if (!el.dataset.src) el.dataset.src = el.textContent;
      el.removeAttribute('data-processed');
      el.innerHTML = el.dataset.src;
    });
    mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', flowchart: { htmlLabels: true, curve: 'basis' } });
    mermaid.run({ querySelector: '.mermaid' });
  }
  initMermaid();

  // === Syntax highlighting ===
  if (window.hljs) {
    document.querySelectorAll('pre code').forEach(el => {
      try { hljs.highlightElement(el); } catch (e) {}
    });
  }

  // === Copy button on pre ===
  document.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'copy';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText);
      btn.textContent = 'copied';
      setTimeout(() => btn.textContent = 'copy', 1200);
    });
    pre.appendChild(btn);
  });

  // === A2 進度條 ===
  const progress = document.getElementById('read-progress');
  function updateProgress() {
    const h = document.documentElement;
    const total = h.scrollHeight - h.clientHeight;
    progress.style.width = total > 0 ? (h.scrollTop / total * 100) + '%' : '0%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  updateProgress();

  // === TOC active section highlight + smooth scroll ===
  const tocLinks = document.querySelectorAll('nav.toc a');
  const tocSections = [...tocLinks].map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
  function setActive() {
    if (!tocSections.length) return;
    let current = tocSections[0];
    for (const s of tocSections) {
      if (s.getBoundingClientRect().top < 100) current = s;
    }
    tocLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current.id));
  }
  window.addEventListener('scroll', setActive, { passive: true });
  setActive();
  tocLinks.forEach(a => {
    a.addEventListener('click', e => {
      const tgt = document.querySelector(a.getAttribute('href'));
      if (tgt) { e.preventDefault(); tgt.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  });

  // === A1 詞彙懸停提示 ===
  (function () {
    const glossary = window.GLOSSARY || {};
    const terms = Object.keys(glossary);
    if (!terms.length) return;

    // 由長到短排序，避免 "AI Engine" 被 "AIE" 切走
    terms.sort((a, b) => b.length - a.length);

    // 把 main 內的純文字節點掃過一次，第一次出現的 term 包成 <span class="term">
    const seen = new Set();
    const skipTags = new Set(['CODE','PRE','SCRIPT','STYLE','A','SUMMARY','BUTTON','OPTION','TEXTAREA','INPUT','SVG']);
    const mainEl = document.querySelector('main');
    if (!mainEl) return;

    function walk(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        const txt = node.nodeValue;
        if (!txt || !txt.trim()) return;
        for (const t of terms) {
          if (seen.has(t)) continue;
          const i = txt.indexOf(t);
          if (i < 0) continue;
          // 確認前後不是字母/數字（避免 'AIE' 切到 'AIEarch'）
          const before = i > 0 ? txt[i-1] : '';
          const after  = i+t.length < txt.length ? txt[i+t.length] : '';
          const isWordChar = c => /[A-Za-z0-9_]/.test(c);
          // 英文 term 才檢查字界；中文/混合就放寬
          if (/^[A-Za-z]/.test(t) && (isWordChar(before) || isWordChar(after))) continue;
          // 拆 text node
          const span = document.createElement('span');
          span.className = 'term';
          span.dataset.term = t;
          span.textContent = t;
          const before_node = document.createTextNode(txt.slice(0, i));
          const after_node  = document.createTextNode(txt.slice(i+t.length));
          const parent = node.parentNode;
          parent.insertBefore(before_node, node);
          parent.insertBefore(span, node);
          parent.insertBefore(after_node, node);
          parent.removeChild(node);
          seen.add(t);
          // 繼續處理 after_node（可能還有其他 term）
          walk(after_node);
          return;
        }
        return;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (skipTags.has(node.tagName)) return;
      // 已經是 .term 或詞彙表內部不處理
      if (node.classList && (node.classList.contains('term') || node.classList.contains('glossary-table'))) return;
      // copy 子節點 list 再 iterate，因為過程會修改 DOM
      const children = [...node.childNodes];
      for (const c of children) walk(c);
    }
    walk(mainEl);

    // tooltip
    const tip = document.getElementById('term-tooltip');
    function showTip(target) {
      const t = target.dataset.term;
      const def = glossary[t];
      if (!def) return;
      tip.innerHTML = '<strong>' + t + '</strong>' + def;
      tip.classList.add('visible');
      const r = target.getBoundingClientRect();
      // 嘗試放在下方，超出視窗就放上方
      tip.style.left = Math.max(8, Math.min(window.innerWidth - 380, r.left)) + 'px';
      let top = r.bottom + 6;
      tip.style.top = top + 'px';
      const tipRect = tip.getBoundingClientRect();
      if (tipRect.bottom > window.innerHeight - 8) {
        tip.style.top = (r.top - tipRect.height - 6) + 'px';
      }
    }
    function hideTip() { tip.classList.remove('visible'); }
    document.body.addEventListener('mouseover', e => {
      const t = e.target.closest('.term');
      if (t) showTip(t);
    });
    document.body.addEventListener('mouseout', e => {
      const t = e.target.closest('.term');
      if (t) hideTip();
    });
    document.body.addEventListener('focusin', e => {
      const t = e.target.closest('.term');
      if (t) showTip(t);
    });
    document.body.addEventListener('focusout', e => {
      const t = e.target.closest('.term');
      if (t) hideTip();
    });
  })();
</script>

</body>
</html>
