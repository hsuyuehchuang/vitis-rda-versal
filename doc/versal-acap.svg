<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Versal ACAP contains PS, PL, and AIE">
  <style>
    /* Default = dark mode（對齊 doc/dataflow.html GitHub-Dark 系列 + AIE 紫色） */
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans TC", sans-serif; }
    .bg-outer    { fill: #161b22;   stroke: #30363d; }
    .title       { fill: #c9d1d9; }

    .box-ps      { fill: rgba(210,153,34,0.10);  stroke: #d29922; }
    .text-ps     { fill: #d29922; }
    .text-ps-2   { fill: #c9d1d9; }
    .text-ps-dim { fill: #b58218; }

    .box-pl      { fill: rgba(77,194,90,0.10);   stroke: #4dc25a; }
    .text-pl     { fill: #4dc25a; }
    .text-pl-2   { fill: #c9d1d9; }
    .text-pl-dim { fill: #3da849; }

    .box-aie     { fill: rgba(210,168,255,0.10); stroke: #d2a8ff; }
    .text-aie    { fill: #d2a8ff; }
    .text-aie-2  { fill: #c9d1d9; }
    .text-aie-dim{ fill: #b794f4; }

    .connector   { stroke: #6e7681; }

    /* Light mode fallback (跟著 OS 偏好；OS = light 時自動切回淺色版) */
    @media (prefers-color-scheme: light) {
      .bg-outer    { fill: #f8fafc; stroke: #94a3b8; }
      .title       { fill: #0f172a; }

      .box-ps      { fill: #fef3c7; stroke: #d97706; }
      .text-ps     { fill: #78350f; }
      .text-ps-2   { fill: #78350f; }
      .text-ps-dim { fill: #92400e; }

      .box-pl      { fill: #dcfce7; stroke: #16a34a; }
      .text-pl     { fill: #14532d; }
      .text-pl-2   { fill: #14532d; }
      .text-pl-dim { fill: #15803d; }

      .box-aie     { fill: #f3e8ff; stroke: #9333ea; }
      .text-aie    { fill: #581c87; }
      .text-aie-2  { fill: #581c87; }
      .text-aie-dim{ fill: #7e22ce; }

      .connector   { stroke: #64748b; }
    }
  </style>

  <rect class="bg-outer" x="20" y="20" width="860" height="240" rx="14" stroke-width="2"/>
  <text class="title" x="450" y="55" text-anchor="middle" font-size="24" font-weight="700">Versal ACAP / Adaptive SoC</text>

  <rect class="box-ps" x="60" y="90" width="230" height="130" rx="10" stroke-width="2"/>
  <text class="text-ps"     x="175" y="125" text-anchor="middle" font-size="20" font-weight="700">PS</text>
  <text class="text-ps-2"   x="175" y="153" text-anchor="middle" font-size="14">ARM Cortex-A72 CPU core</text>
  <text class="text-ps-2"   x="175" y="178" text-anchor="middle" font-size="14">Linux · host.cpp · XRT</text>
  <text class="text-ps-dim" x="175" y="202" text-anchor="middle" font-size="13">流程 / I/O / 調度</text>

  <rect class="box-pl" x="335" y="90" width="230" height="130" rx="10" stroke-width="2"/>
  <text class="text-pl"     x="450" y="125" text-anchor="middle" font-size="20" font-weight="700">PL</text>
  <text class="text-pl-2"   x="450" y="153" text-anchor="middle" font-size="14">FPGA fabric</text>
  <text class="text-pl-2"   x="450" y="178" text-anchor="middle" font-size="14">mm2s · s2mm · strided</text>
  <text class="text-pl-dim" x="450" y="202" text-anchor="middle" font-size="13">資料搬運 / 自訂 datapath</text>

  <rect class="box-aie" x="610" y="90" width="230" height="130" rx="10" stroke-width="2"/>
  <text class="text-aie"     x="725" y="125" text-anchor="middle" font-size="20" font-weight="700">AIE</text>
  <text class="text-aie-2"   x="725" y="153" text-anchor="middle" font-size="14">Vector processor array</text>
  <text class="text-aie-2"   x="725" y="178" text-anchor="middle" font-size="14">FFT · twiddle multiply</text>
  <text class="text-aie-dim" x="725" y="202" text-anchor="middle" font-size="13">高吞吐 DSP 運算</text>

  <path class="connector" d="M292 155 H333" stroke-width="2" stroke-dasharray="5 4"/>
  <path class="connector" d="M567 155 H608" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
