  <text x="725" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#831843">FFT · twiddle multiply</text>
  <text x="725" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#be185d">高吞吐 DSP 運算</text>

  <path d="M292 155 H333" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M567 155 H608" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
